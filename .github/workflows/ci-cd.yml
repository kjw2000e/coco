name: Android CI/CD

on:
  push:
    branches:
      - main # main 브랜치에 push될 때 실행
  pull_request:
    branches:
      - main # PR 생성 시 실행

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest # 빌드 환경 (리눅스)
    steps:
      # 1. 리포지토리 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 설정 (안드로이드 빌드에 필요)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # OpenJDK 배포판
          java-version: 17

      # 3. Gradle 캐싱 (빌드 속도 최적화)
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Gradle 빌드 실행
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Unit Test 실행
      - name: Run Unit Tests
        run: ./gradlew test

      # 6. APK 업로드 (빌드 결과물을 아티팩트로 저장)
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
